name: Website Build Check

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "rebuild.sh"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "rebuild.sh"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Website Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm

      - name: Detect website source
        id: website-source
        shell: bash
        run: |
          if [[ -f website/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::website/package.json is supplied by the companion website repository; website/data-only changes do not have local build sources."
          fi

      - name: Install website dependencies
        if: steps.website-source.outputs.present == 'true'
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build website
        if: steps.website-source.outputs.present == 'true'
        working-directory: website
        run: npm run build
