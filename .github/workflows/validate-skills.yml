name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".opencode/skills/**"
      - "opencode.json"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - ".opencode/skills/**"
      - "opencode.json"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skill Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate all structural checks
        run: npm run validate

      - name: Validate semantic pipeline references
        run: npm run validate:pipelines

      - name: Validate security policy
        run: npm run validate:security

      - name: Validate exact website publication mirror
        run: npm run validate:sync

      - name: Validate CLI shell syntax
        run: bash -n aiw scripts/*.sh scripts/lib/*.sh

      - name: Verify init does not copy populated secrets
        run: bash tests/test-cli-security.sh

  documentation:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check internal Markdown links
        run: node scripts/validate-doc-links.js
