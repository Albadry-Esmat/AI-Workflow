name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".opencode/skills/**"
      - "opencode.json"
      - "aiw"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/validate-skills.yml"
      - ".github/workflows/secret-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - ".opencode/skills/**"
      - "opencode.json"
      - "aiw"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/validate-skills.yml"
      - ".github/workflows/secret-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skill Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate all structural checks
        run: npm run validate

      - name: Validate semantic pipeline references
        run: npm run validate:pipelines

      - name: Validate security policy
        run: npm run validate:security

      - name: Validate exact website publication mirror
        run: npm run validate:sync

      - name: Validate capability index
        run: npm run validate:capabilities

      - name: Run CLI regression tests
        run: npm test

      - name: Smoke-test planner JSON output
        run: npm run --silent plan -- --pipeline requirements-only --json > /tmp/aiw-plan.json && node -e 'const p=require("/tmp/aiw-plan.json"); if (!p.dry_run || p.pipeline.name !== "requirements-only") process.exit(1);'

      - name: Validate CLI shell syntax
        run: bash -n aiw scripts/*.sh scripts/lib/*.sh

      - name: Verify init does not copy populated secrets
        run: bash tests/test-cli-security.sh

  documentation:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Check internal Markdown links
        run: node scripts/validate-doc-links.js
