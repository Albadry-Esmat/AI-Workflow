name: Sync Website Data

on:
  push:
    branches: [main]
    paths:
      - "skills/index.yaml"
      - "skills/registry.json"
      - "skills/graph/**"
      - "skills/pipelines/**"
      - "docs/changelog.md"
      - "opencode.json"
      - ".opencode/skills/**/SKILL.md"
      - "website/data/site-content.json"
      - "scripts/patch-site-content.js"
      - "scripts/sync-website-data.sh"
      - "scripts/verify-website-sync.js"
      - "scripts/validate-pipeline-references.js"
      - "scripts/validate-security-policy.js"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: sync-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Validate and propose website data sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install pinned validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate source artifacts
        run: |
          npm run validate:pipelines
          npm run validate:security
          npm run validate

      - name: Update and verify the local publication mirror
        run: |
          node scripts/patch-site-content.js
          bash scripts/sync-website-data.sh
          npm run validate:sync

      - name: Checkout ASE-OS-Website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Albadry-Esmat/ASE-OS-Website
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: ase-os-website
          fetch-depth: 0

      - name: Validate target layout before mirroring
        run: |
          test -d "$GITHUB_WORKSPACE/ase-os-website/data"
          test -f "$GITHUB_WORKSPACE/ase-os-website/package.json"

      - name: Mirror exact validated artifact
        run: node scripts/mirror-publication-artifact.js website/data ase-os-website/data

      - name: Verify target after mirroring
        run: node scripts/verify-website-sync.js --target "$GITHUB_WORKSPACE/ase-os-website/data" --check --report ase-os-website/data/publication-verification.json

      - name: Create synchronization pull request
        working-directory: ase-os-website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          rm -f data/publication-verification.json
          if [[ -z "$(git status --short)" ]]; then
            echo "Website data is already synchronized."
            exit 0
          fi

          SYNC_BRANCH="automation/sync-${GITHUB_SHA::12}"
          git switch -c "$SYNC_BRANCH"
          VERSION=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("data/skills/registry.json", "utf8")); process.stdout.write(x.version || "unreleased")')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "sync: update data/ from AI-Workflow v${VERSION}" \
            -m "Source commit: ${GITHUB_SHA}" \
            -m "Generated by the validated AI-Workflow publication pipeline."
          git push --set-upstream origin "$SYNC_BRANCH"
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "sync: update website data from AI-Workflow" \
            --body "Automated data publication from AI-Workflow commit ${GITHUB_SHA}.\n\nThe source artifact passed structural, semantic, security, and exact mirror validation before this pull request was created."
