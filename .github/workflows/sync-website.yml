name: Sync Website Data

# ─── Triggers ────────────────────────────────────────────────────────────────
# Runs automatically on every push to main that touches any data source file.
# Can also be triggered manually from GitHub Actions UI (workflow_dispatch).
on:
  push:
    branches:
      - main
    paths:
      - "skills/index.yaml"
      - "skills/registry.json"
      - "skills/graph/**"
      - "skills/pipelines/**"
      - "docs/changelog.md"
      - "opencode.json"
      - ".opencode/skills/**/SKILL.md"
      - "website/data/site-content.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if no data files changed"
        required: false
        default: "false"

# ─── Concurrency ─────────────────────────────────────────────────────────────
# Only one sync runs at a time — queue any extras, cancel stale ones.
concurrency:
  group: sync-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Job 1: Validate that source files are internally consistent ──────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2 --quiet

      - name: Validate skills/index.yaml is valid YAML
        run: |
          python3 -c "
          import yaml, sys
          try:
              with open('skills/index.yaml') as f:
                  yaml.safe_load(f)
              print('  PASS: skills/index.yaml is valid YAML')
          except yaml.YAMLError as e:
              print(f'  FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Validate skills/registry.json is valid JSON
        run: |
          node -e "
            const fs = require('fs');
            try {
              JSON.parse(fs.readFileSync('skills/registry.json', 'utf8'));
              console.log('  PASS: skills/registry.json is valid JSON');
            } catch (e) {
              process.stderr.write('  FAIL: ' + e.message + '\n');
              process.exit(1);
            }
          "

      - name: Validate opencode.json is valid JSON
        run: |
          node -e "
            const fs = require('fs');
            try {
              JSON.parse(fs.readFileSync('opencode.json', 'utf8'));
              console.log('  PASS: opencode.json is valid JSON');
            } catch (e) {
              process.stderr.write('  FAIL: ' + e.message + '\n');
              process.exit(1);
            }
          "

  # ── Job 2: Sync data files to ASE-OS-Website repo ───────────────────────────
  sync:
    name: Sync → ASE-OS-Website
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout AI-Workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Checkout ASE-OS-Website main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Albadry-Esmat/ASE-OS-Website
          ref: main
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: ase-os-website

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          npm ci --ignore-scripts
          pip install pyyaml==6.0.2 jsonschema==4.23.0 --quiet
          npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1

      # ── Auto-patch and validate source data ───────────────────────────────────
      - name: Patch site-content.json (derive counts from source files)
        run: node scripts/patch-site-content.js

      - name: Run full source validation
        run: bash scripts/validate-skills.sh

      - name: Validate execution contracts
        run: python3 scripts/validate-execution-contracts.py

      - name: Validate Batch 6 controls
        run: python3 scripts/validate-batch6-controls.py

      - name: Validate Batch 5/6 evaluation definitions
        run: python3 scripts/validate-quick-review-evals.py

      - name: Run Batch 5/6 quick-review evaluation suite
        run: python3 scripts/evaluate-quick-review.py

      - name: Validate Batch 7 traceability
        run: python3 scripts/validate-traceability.py

      - name: Test Batch 7 context preservation
        run: python3 scripts/test-context-preservation.py

      - name: Evaluate Batch 7 quality vector
        run: python3 scripts/evaluate-quality-vector.py

      - name: Record Batch 8 generalized evidence
        run: |
          python3 scripts/run-operational-evidence.py --pipeline full-pipeline
          python3 scripts/run-operational-evidence.py --pipeline insights-adaptation-pipeline

      - name: Measure Batch 8 SLOs
        run: python3 scripts/measure-slos.py

      - name: Evaluate model/provider compatibility and rollback
        run: python3 scripts/evaluate-model-compatibility.py

      - name: Test Batch 8 telemetry privacy
        run: python3 scripts/test-telemetry-privacy.py

      - name: Simulate Batch 8 incident containment
        run: python3 scripts/simulate-incident-containment.py

      - name: Validate Batch 8 operational controls
        run: python3 scripts/validate-batch8-controls.py

      - name: Run sync deletion regression test
        run: bash scripts/sync-website-data.sh --test-deletion

      # ── Exact delete-aware mirror ────────────────────────────────────────────
      - name: Mirror website data exactly
        run: |
          rm -rf ase-os-website/data
          mkdir -p ase-os-website/data
          cp -a website/data/. ase-os-website/data/

      - name: Verify exact mirror and compute data hash
        run: |
          python3 scripts/data-integrity.py compare website/data ase-os-website/data --json
          DATA_HASH=$(python3 scripts/data-integrity.py hash website/data)
          echo "DATA_HASH=sha256:${DATA_HASH}" >> "$GITHUB_ENV"
          echo "Data hash: sha256:${DATA_HASH}"

      - name: Generate and validate ReleaseManifest
        run: |
          python3 scripts/generate-release-manifest.py \
            --source-root . \
            --website-root ase-os-website \
            --data-hash "$DATA_HASH" \
            --source-validation pass \
            --website-validation not-run \
            --website-build not-run \
            --output ase-os-website/data/release-manifest.json \
            --validate

      - name: Check source/website release compatibility
        run: python3 scripts/check-release-compatibility.py --manifest ase-os-website/data/release-manifest.json

      # ── Detect changes ───────────────────────────────────────────────────────
      - name: Check for changes
        id: changes
        working-directory: ase-os-website
        run: |
          git diff --stat
          CHANGED=$(git status --short | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" -gt 0 ]; then
            echo "  → $CHANGED file(s) changed"
          else
            echo "  → Nothing changed — ASE-OS-Website data is already up to date"
          fi

      # ── Commit & push ────────────────────────────────────────────────────────
      - name: Commit and push to ASE-OS-Website
        if: steps.changes.outputs.changed != '0'
        working-directory: ase-os-website
        run: |
          # Detect version from changelog for a meaningful commit message
          VERSION=$(grep -m1 '## \[' ../docs/changelog.md 2>/dev/null \
                    | sed 's/.*\[\(.*\)\].*/\1/' || echo "latest")

          # Detect which source files actually changed (for commit body)
          CHANGED_FILES=$(git status --short | awk '{print $2}' | head -10 | tr '\n' ' ')

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "sync: update data/ from AI-Workflow v${VERSION}" \
            -m "Triggered by push to Albadry-Esmat/AI-Workflow@${{ github.sha }}" \
            -m "Changed: ${CHANGED_FILES}" \
            -m "Source: https://github.com/Albadry-Esmat/AI-Workflow/commit/${{ github.sha }}"

          git push origin Dev

      - name: No changes — skip push
        if: steps.changes.outputs.changed == '0'
        run: echo "✅ ASE-OS-Website data is already up to date. Nothing to push."

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          VERSION=$(grep -m1 '## \[' docs/changelog.md 2>/dev/null \
                    | sed 's/.*\[\(.*\)\].*/\1/' || echo "latest")
          CHANGED="${{ steps.changes.outputs.changed }}"

          echo "## 🔄 Website Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AI-Workflow version | \`v${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Files changed | ${CHANGED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Data hash | `${DATA_HASH:-not-computed}` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target repo | [Albadry-Esmat/ASE-OS-Website](https://github.com/Albadry-Esmat/ASE-OS-Website) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Live site | [ase-os.vercel.app](https://ase-os.vercel.app) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANGED" != "0" ]; then
            echo "✅ **Data pushed.** Vercel will auto-deploy ASE-OS-Website shortly." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Already in sync.** No push needed." >> "$GITHUB_STEP_SUMMARY"
          fi
