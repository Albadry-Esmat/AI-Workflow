name: Cross-Repository Website Sync (retired)

# W0 permanently removes the authenticated cross-repository write path.
# The workflow is also disabled through GitHub workflow controls. If manually
# re-enabled, it remains inert and has no token, checkout, or write operation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: No cross-repository mutation
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retired state
        run: echo "Cross-repository website synchronization is retired; no external repository writes are performed."
