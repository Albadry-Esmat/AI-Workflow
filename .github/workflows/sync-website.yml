# Website data publication workflow.
# The source repository owns the mirror contents; the workflow only publishes
# the already-validated website/data/ tree to ASE-OS-Website.

name: Sync Website Data

on:
  push:
    branches:
      - main
    paths:
      - "skills/index.yaml"
      - "skills/registry.json"
      - "skills/graph/**"
      - "skills/pipelines/**"
      - "docs/changelog.md"
      - "opencode.json"
      - ".opencode/skills/**/SKILL.md"
      - "scripts/patch-site-content.js"
      - "scripts/website-data-manifest.json"
      - "scripts/website-data-manifest.js"
      - "scripts/sync-website-data.sh"
      - "website/data/site-content.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if no data files changed"
        required: false
        default: "false"

defaults:
  run:
    shell: bash

concurrency:
  group: sync-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --silent
          python3 -m pip install pyyaml==6.0.2 --quiet
          npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1 --silent

      - name: Validate skills and pipeline contracts
        run: bash scripts/validate-skills.sh

      - name: Validate semantic pipeline invariants
        run: node scripts/validate-pipelines.js

      - name: Security and supply-chain check
        run: node scripts/security-check.js

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high --omit=optional

      - name: Run production-hardening conformance tests
        run: npm test -- --runInBand

      - name: Verify website mirror is current
        run: bash scripts/sync-website-data.sh --check

  sync:
    name: Sync → ASE-OS-Website
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout AI-Workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Checkout ASE-OS-Website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Albadry-Esmat/ASE-OS-Website
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: ase-os-website
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Verify source mirror before publication
        run: bash scripts/sync-website-data.sh --check

      - name: Validate target repository layout
        run: |
          test -d ase-os-website/.git
          test -d ase-os-website/data
          git -C ase-os-website branch --show-current

      - name: Mirror validated website data
        run: rsync -a --delete website/data/ ase-os-website/data/

      - name: Check for changes
        id: changes
        working-directory: ase-os-website
        run: |
          git diff --stat
          changed=$(git status --short | wc -l | tr -d ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed files: $changed"

      - name: Commit and push to ASE-OS-Website
        if: steps.changes.outputs.changed != '0'
        working-directory: ase-os-website
        run: |
          version=$(grep -m1 '## \[' ../docs/changelog.md 2>/dev/null \
            | sed 's/.*\[\(.*\)\].*/\1/' || echo "latest")
          changed_files=$(git status --short | awk '{print $2}' | head -20 | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "sync: update data/ from AI-Workflow v${version}" \
            -m "Triggered by push to Albadry-Esmat/AI-Workflow@${{ github.sha }}" \
            -m "Changed: ${changed_files}" \
            -m "Source: https://github.com/Albadry-Esmat/AI-Workflow/commit/${{ github.sha }}"
          git push origin HEAD:main

      - name: No changes — skip push
        if: steps.changes.outputs.changed == '0'
        run: echo "ASE-OS-Website data is already current. Nothing to push."

      - name: Job summary
        if: always()
        run: |
          version=$(grep -m1 '## \[' docs/changelog.md 2>/dev/null \
            | sed 's/.*\[\(.*\)\].*/\1/' || echo "latest")
          changed="${{ steps.changes.outputs.changed }}"
          {
            echo "## Website Sync Summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| AI-Workflow version | \\`v${version}\\` |"
            echo "| Commit | \\`${{ github.sha }}\\` |"
            echo "| Files changed | ${changed} |"
            echo "| Target repo | [ASE-OS-Website](https://github.com/Albadry-Esmat/ASE-OS-Website) |"
            echo "| Live site | [ase-os.vercel.app](https://ase-os.vercel.app) |"
          } >> "$GITHUB_STEP_SUMMARY"
