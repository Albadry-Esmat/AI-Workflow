# AI Workflow — Capability/Authority Source (AUTHORITATIVE, P0 bootstrap v1)
# Single source for capability + authority metadata.
# Projections (registry.json authority extension, index.yaml tags) are GENERATED
# via scripts/sync-authority.js --write and CI-validated via --check.
# P0/P1: read-only bootstrap scraped from opencode.json + registry.json.
# No execution behavior changes.
version: "1.1.0"
ownership: ai-workflow
authority: authoritative-capability-source
defaults:
  routing_eligible: false
  note: Any agent without explicit authority/SoD/risk/fallback metadata defaults to routing_eligible=false / deny. Resolver must reject unlisted agents.
agents:
