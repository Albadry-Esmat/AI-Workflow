    capabilities: [orchestration, multi-step-reasoning]
    authority: [routing, governance, gate-relay]
    separation_of_duty: [never-specialist, never-approver]
    permissions: {edit: ask, bash: ask}
    risk_eligibility: [low, medium, high, critical]
    fallback_eligibility: false
    cost_class: medium
    availability: true
  analyzer:
