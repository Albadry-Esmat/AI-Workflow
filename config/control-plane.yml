# Control-plane protection (C) — the system may never weaken its own controls.
version: "1.0.0"
protected_paths:
  - .github/workflows/
  - config/merge-policy.yml
  - config/review-policy.yml
  - config/validation-profile.yml
  - config/budget-policy.yml
  - config/control-plane.yml
  - config/risk-policy.yml
  - config/rollback-policy.yml
  - config/backlog-policy.yml
  - config/policy-versions.yml
  - config/agent-runtime-policy.json
  - config/agent-runtime-catalog.json
  # Model authority (single source of truth for model requirements).
  - config/model-requirements.yml
  - config/model-requirements-schema.json
  # Governance evidence and policy contracts.
  - config/governance-decision-schema.json
  - config/terminal-failure-schema.json
  - config/governance-flags-policy.json
  - config/governance-flags-policy-schema.json
  - config/task-router.yaml
  - config/trace-envelope-schema.json
  - config/policy-gateway.yaml
  - config/retry-reasons.json
  # Pipeline gate definitions (timeout/bypass/override semantics live here).
  - skills/pipelines/
  - skills/schema/
  # Governance enforcement code (validators, registries, gateways, caches).
  - scripts/policy-gateway.js
  - scripts/policy-approval.js
  - scripts/gate-decisions.js
  - scripts/resolve-override.js
  - scripts/file-lock.js
  - scripts/sanitize-id.js
  - scripts/invocation-cache.js
  - scripts/escalate-case.js
  - scripts/validate-pipeline-gates.py
  - scripts/validate-governance-flags.py
  - scripts/workflow-state.js
  - scripts/case-store.js
  - scripts/release-review.js
  - scripts/task-router.js
  - scripts/resolve-model.js
  - scripts/runtime-models.js
  - scripts/trace-envelope.js
  - scripts/policy-loader.js
  # Orchestrator, guards, reviewers, and delegation/debate contracts.
  - .agents/skills/orchestrator/
  - .agents/skills/security-guard/
  - .agents/skills/database-guard/
  - .agents/skills/performance-guard/
  - .agents/skills/ui-ux-compliance-guard/
  - .agents/skills/implementation-completeness-guard/
  - .agents/skills/implementation-completeness-auditor/
  - .agents/skills/cross-artifact-consistency/
  - .agents/skills/compliance-gate/
  - .agents/skills/work-item-lifecycle-guard/
  - .agents/skills/github-merge-gate/
  - .agents/skills/github-pr-review/
  - .agents/skills/delegate/
  - .agents/skills/plan-debate/
  - .agents/skills/multi-agent-debate/
  - opencode.json
  - .opencode/agent/
  - docs/bot-ownership.md
  - docs/security.md
  - docs/governance.md
  - docs/branch-protection.md
  - docs/agents.md
  - docs/models.md
classification: GOVERNANCE_CHANGE
governance_change_behavior:
  disable_normal_auto_merge: true
  require: elevated_governance_review
  initial_rollout: human_approval_required
