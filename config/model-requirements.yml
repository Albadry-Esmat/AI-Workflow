# ─────────────────────────────────────────────────────────────────────────────
# AI Workflow — Model Requirements Manifest (AUTHORITATIVE, v2)
#
# Boundary: Declare → Verify → Consume → Execute. Never Install → Connect →
# Authenticate → Configure.
#
# - This file is the SOLE authority for model POLICY.
# - Precedence (highest wins, deterministic):
#     agent/task-specific explicit model → global agent model →
#     current runtime/session model.
# - `model: null` (or absent) means INHERIT — continue to the lower-priority
#   source. Inheritance is normal, NOT fallback.
# - An exact `model` means REQUIRE EXACTLY THIS MODEL. Unavailable explicit
#   overrides fail closed with no silent inheritance.
# - `global_agent_model` (null or exact id) applies to all agents/tasks
#   without their own override. It is policy — never confuse it with the
#   runtime's own selected model.
# - `tier_hint` is descriptive metadata ONLY and MUST NOT determine execution.
# - `provider` / `capabilities` describe WHAT is needed, never HOW the provider
#   is provisioned (no api_key, login_command, install_command, provider_setup).
# - Availability comes from the runtime capability interface
#   (runtime.listAvailableModels); the current session model comes from
#   scripts/runtime-session-model.js. The workflow verifies and consumes; the
#   runtime owns what is installed, connected, authenticated, and available.
# ─────────────────────────────────────────────────────────────────────────────
version: "2.0.0"
ownership: ai-workflow
authority: authoritative-model-selection
unavailable_behavior_default: fail_closed

# Optional shared override for all agents/tasks without their own model.
# null = no global override (inherit the runtime/session model).
global_agent_model: null

